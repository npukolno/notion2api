name: build-binaries

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: notion2api
  PACKAGE_MAIN: ./cmd/notion2api

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            goos: windows
            goarch: amd64
            goarm: ""
            ext: .exe
            archive: zip
          - target: windows-arm64
            goos: windows
            goarch: arm64
            goarm: ""
            ext: .exe
            archive: zip
          - target: linux-amd64
            goos: linux
            goarch: amd64
            goarm: ""
            ext: ""
            archive: tar.gz
          - target: linux-386
            goos: linux
            goarch: "386"
            goarm: ""
            ext: ""
            archive: tar.gz
          - target: linux-arm64
            goos: linux
            goarch: arm64
            goarm: ""
            ext: ""
            archive: tar.gz
          - target: linux-armv6
            goos: linux
            goarch: arm
            goarm: "6"
            ext: ""
            archive: tar.gz
          - target: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
            archive: tar.gz
          - target: linux-riscv64
            goos: linux
            goarch: riscv64
            goarm: ""
            ext: ""
            archive: tar.gz
          - target: linux-ppc64le
            goos: linux
            goarch: ppc64le
            goarm: ""
            ext: ""
            archive: tar.gz
          - target: linux-s390x
            goos: linux
            goarch: s390x
            goarm: ""
            ext: ""
            archive: tar.gz
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
            goarm: ""
            ext: ""
            archive: tar.gz
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
            goarm: ""
            ext: ""
            archive: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Build archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          BIN_EXT: ${{ matrix.ext }}
          ARCHIVE_KIND: ${{ matrix.archive }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          bin_name="${APP_NAME}${BIN_EXT}"
          package_name="${APP_NAME}_${VERSION}_${TARGET}"
          staging_dir="dist/${package_name}"

          mkdir -p "${staging_dir}"
          export CGO_ENABLED=0 GOOS GOARCH
          if [[ -n "${GOARM}" ]]; then
            export GOARM
          fi
          go build -trimpath -ldflags="-s -w" -o "${staging_dir}/${bin_name}" "${PACKAGE_MAIN}"

          cp README.md "${staging_dir}/"
          cp LICENSE "${staging_dir}/"
          cp config.example.json "${staging_dir}/"
          cp config.docker.json "${staging_dir}/"

          if [[ "${ARCHIVE_KIND}" == "zip" ]]; then
            (
              cd dist
              zip -r "${package_name}.zip" "${package_name}"
            )
          else
            tar -C dist -czf "dist/${package_name}.tar.gz" "${package_name}"
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.target }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
